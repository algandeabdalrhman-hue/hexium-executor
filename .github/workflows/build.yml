name: Build Lua iOS Library

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Lua
        run: |
          set -euo pipefail

          curl -fsSL \
            https://www.lua.org/ftp/lua-5.4.7.tar.gz \
            -o lua.tar.gz

          tar -xzf lua.tar.gz

      - name: Build iOS-compatible Lua
        shell: bash
        run: |
          set -euo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          cd lua-5.4.7/src

          rm -f *.o liblua.a

          IOS_CFLAGS=(
            -arch arm64
            -isysroot "$SDK"
            -miphoneos-version-min=13.0
            -O2
            -Wall
            -Wextra
            -DLUA_COMPAT_5_3
            -fPIC
          )

          CORE_SOURCES=(
            lapi.c
            lcode.c
            lctype.c
            ldebug.c
            ldo.c
            ldump.c
            lfunc.c
            lgc.c
            llex.c
            lmem.c
            lobject.c
            lopcodes.c
            lparser.c
            lstate.c
            lstring.c
            ltable.c
            ltm.c
            lundump.c
            lvm.c
            lzio.c
            lauxlib.c
            lbaselib.c
            lcorolib.c
            ldblib.c
            liolib.c
            lmathlib.c
            lstrlib.c
            ltablib.c
            lutf8lib.c
            linit.c
          )

          for source in "${CORE_SOURCES[@]}"; do
            clang "${IOS_CFLAGS[@]}" -c "$source"
          done

          ar rcs liblua.a *.o

          mkdir -p "$GITHUB_WORKSPACE/lua/include"
          mkdir -p "$GITHUB_WORKSPACE/lua/lib"

          cp *.h "$GITHUB_WORKSPACE/lua/include/"
          cp liblua.a "$GITHUB_WORKSPACE/lua/lib/"

      - name: Verify Lua
        run: |
          set -euo pipefail

          test -f lua/include/lua.h
          test -f lua/lib/liblua.a

          echo "Lua headers:"
          ls -la lua/include

          echo "Lua static library:"
          file lua/lib/liblua.a

      - name: Build iOS dynamic library
        shell: bash
        run: |
          set -euo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          clang \
            -arch arm64 \
            -fPIC \
            -dynamiclib \
            -isysroot "$SDK" \
            -miphoneos-version-min=13.0 \
            -I"$GITHUB_WORKSPACE/lua/include" \
            -o libLuaBridge.dylib \
            lua_bridge.c \
            "$GITHUB_WORKSPACE/lua/lib/liblua.a"

      - name: Verify dylib
        run: |
          set -euo pipefail

          file libLuaBridge.dylib
          xcrun lipo -info libLuaBridge.dylib

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ios-arm64-lua-dylib
          path: libLuaBridge.dylib
