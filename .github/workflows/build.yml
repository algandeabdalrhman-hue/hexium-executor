name: Build Lua iOS Dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Lua bridge source
        shell: bash
        run: |
          set -euo pipefail

          cat > lua_bridge.c <<'EOF'
          #include "lua.h"
          #include "lauxlib.h"
          #include "lualib.h"

          __attribute__((visibility("default")))
          int lua_bridge_test(void) {
              lua_State *L = luaL_newstate();

              if (L == NULL)
                  return 0;

              luaL_openlibs(L);
              lua_close(L);

              return 1;
          }
          EOF

      - name: Download Lua
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://www.lua.org/ftp/lua-5.4.7.tar.gz \
            -o lua.tar.gz

          tar -xzf lua.tar.gz

      - name: Build Lua for iOS
        shell: bash
        run: |
          set -euo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cd lua-5.4.7/src

          python3 - <<'PY'
          from pathlib import Path

          p = Path("linit.c")
          s = p.read_text()

          s = s.replace(
              "{LUA_LOADLIBNAME, luaopen_package},",
              "/* package disabled on iOS */"
          )

          s = s.replace(
              "{LUA_OSLIBNAME, luaopen_os},",
              "/* os disabled on iOS */"
          )

          p.write_text(s)
          PY

          CFLAGS=(
            -arch arm64
            -isysroot "$SDK"
            -miphoneos-version-min=13.0
            -O2
            -fPIC
          )

          SOURCES=(
            lapi.c
            lcode.c
            lctype.c
            ldebug.c
            ldo.c
            ldump.c
            lfunc.c
            lgc.c
            llex.c
            lmem.c
            lobject.c
            lopcodes.c
            lparser.c
            lstate.c
            lstring.c
            ltable.c
            ltm.c
            lundump.c
            lvm.c
            lzio.c
            lauxlib.c
            lbaselib.c
            lcorolib.c
            ldblib.c
            liolib.c
            lmathlib.c
            lstrlib.c
            ltablib.c
            lutf8lib.c
            linit.c
          )

          rm -f *.o liblua.a

          for source in "${SOURCES[@]}"; do
            clang "${CFLAGS[@]}" -c "$source"
          done

          ar rcs liblua.a *.o

          mkdir -p "$GITHUB_WORKSPACE/lua/include"
          mkdir -p "$GITHUB_WORKSPACE/lua/lib"

          cp *.h "$GITHUB_WORKSPACE/lua/include/"
          cp liblua.a "$GITHUB_WORKSPACE/lua/lib/"

      - name: Build Lua dylib
        shell: bash
        run: |
          set -euo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          clang \
            -arch arm64 \
            -fPIC \
            -dynamiclib \
            -isysroot "$SDK" \
            -miphoneos-version-min=13.0 \
            -I"$GITHUB_WORKSPACE/lua/include" \
            lua_bridge.c \
            "$GITHUB_WORKSPACE/lua/lib/liblua.a" \
            -o libLuaBridge.dylib

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail

          file libLuaBridge.dylib
          xcrun lipo -info libLuaBridge.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: ios-arm64-lua-dylib
          path: libLuaBridge.dylib
