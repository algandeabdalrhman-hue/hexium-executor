name: Build Lua iOS Dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Lua
        shell: bash
        run: |
          set -euo pipefail

          LUA_VERSION="5.4.7"

          curl -fsSL \
            "https://www.lua.org/ftp/lua-${LUA_VERSION}.tar.gz" \
            -o lua.tar.gz

          tar -xzf lua.tar.gz

      - name: Build Lua for iOS ARM64
        shell: bash
        run: |
          set -euo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          cd lua-5.4.7/src

          rm -f *.o liblua.a

          CFLAGS=(
            -arch arm64
            -isysroot "$SDK"
            -miphoneos-version-min=13.0
            -O2
            -Wall
            -Wextra
            -DLUA_COMPAT_5_3
            -fPIC
          )

          SOURCES=(
            lapi.c
            lcode.c
            lctype.c
            ldebug.c
            ldo.c
            ldump.c
            lfunc.c
            lgc.c
            llex.c
            lmem.c
            lobject.c
            lopcodes.c
            lparser.c
            lstate.c
            lstring.c
            ltable.c
            ltm.c
            lundump.c
            lvm.c
            lzio.c
            lauxlib.c
            lbaselib.c
            lcorolib.c
            ldblib.c
            liolib.c
            lmathlib.c
            lstrlib.c
            ltablib.c
            lutf8lib.c
            linit.c
          )

          for source in "${SOURCES[@]}"; do
            clang "${CFLAGS[@]}" -c "$source"
          done

          ar rcs liblua.a *.o

          mkdir -p "$GITHUB_WORKSPACE/lua/include"
          mkdir -p "$GITHUB_WORKSPACE/lua/lib"

          cp *.h "$GITHUB_WORKSPACE/lua/include/"
          cp liblua.a "$GITHUB_WORKSPACE/lua/lib/"

      - name: Verify Lua
        shell: bash
        run: |
          set -euo pipefail

          test -f "$GITHUB_WORKSPACE/lua/include/lua.h"
          test -f "$GITHUB_WORKSPACE/lua/lib/liblua.a"

          echo "lua.h:"
          ls -l "$GITHUB_WORKSPACE/lua/include/lua.h"

          echo "liblua.a:"
          file "$GITHUB_WORKSPACE/lua/lib/liblua.a"

      - name: Locate bridge source
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$GITHUB_WORKSPACE/lua_bridge.c" ]; then
            echo "SOURCE=$GITHUB_WORKSPACE/lua_bridge.c" >> "$GITHUB_ENV"
          elif [ -f "$GITHUB_WORKSPACE/src/lua_bridge.c" ]; then
            echo "SOURCE=$GITHUB_WORKSPACE/src/lua_bridge.c" >> "$GITHUB_ENV"
          else
            echo "ERROR: lua_bridge.c was not found."
            echo "Add lua_bridge.c to the repository before building."
            exit 1
          fi

      - name: Build iOS dynamic library
        shell: bash
        run: |
          set -euo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          clang \
            -arch arm64 \
            -fPIC \
            -dynamiclib \
            -isysroot "$SDK" \
            -miphoneos-version-min=13.0 \
            -I"$GITHUB_WORKSPACE/lua/include" \
            -o libLuaBridge.dylib \
            "$SOURCE" \
            "$GITHUB_WORKSPACE/lua/lib/liblua.a"

      - name: Verify dylib
        shell: bash
        run: |
          set -euo pipefail

          test -f libLuaBridge.dylib

          file libLuaBridge.dylib
          xcrun lipo -info libLuaBridge.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: ios-arm64-lua-dylib
          path: libLuaBridge.dylib
